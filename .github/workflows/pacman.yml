name: Atualizar Pac-Man de contribuições

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/pacman.yml

permissions:
  contents: read

concurrency:
  group: profile-pacman
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Gerar animações com as contribuições do perfil
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          games: pacman

      - name: Atualizar arquivos de animação
        run: |
          mkdir -p assets
          cp dist/pacman-contribution-graph.svg assets/
          cp dist/pacman-contribution-graph-dark.svg assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: atualiza animações de contribuições'
          git pull --rebase origin main
          git push origin HEAD:main
